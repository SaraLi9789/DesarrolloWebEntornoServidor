<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head> 
	    <title>Pantalla 2</title>
	    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	</head>
<body>
	<p th:text="${error}"></p>
		<form th:action="@{/pantalla2}" method="post">
			

			<label>Edad:</label>
			<select name="edad">
				<option value="10-19" th:selected="${edad == '10-19'}">10-19-</option>
				<option value="20-29" th:selected="${edad == '20-29'}">20-29-</option>
				<option value="30-39" th:selected="${edad == '30-39'}">30-39</option>
				<option value="40-49" th:selected="${edad == '40-49'}">40-49</option>
				<option value="50-59" th:selected="${edad == '50-59'}">50-59</option>
				<option value="60-69" th:selected="${edad == '60-69'}">60-69</option>
				<option value="70-79" th:selected="${edad == '70-79'}">70-79</option>
				<option value="80-89" th:selected="${edad == '80-89'}">80-89</option>
				<option value="90-99" th:selected="${edad == '90-99'}">90-99</option>
			</select>
			
			<p>Sexo:</p>
			<label>Mujer</label>
			<input type="radio" value="Mujer" name="sexo" th:checked="${sexo== 'Mujer'}">
			
			<label>Hombre</label>
			<input type="radio" value="Hombre" name="sexo" th:checked="${sexo== 'Hombre'}">
			
			<input type="submit" value="siguiente" >
		</form>
		<form th:action="@{/volverPantalla1}" method="get">
		    <input type="submit" value="Anterior">
		</form>
</body>
